# The study of the genetic search against a seeded sample, over the design space of the sample site (scripts/study-evolve.ts).
# A person starts it: gh workflow run study.yml -f seeds=10 -f budgets=200,400
# The record of the run is the artifact study-evolve.
name: Study

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: The count of the seeds, 2 or more
        required: true
        default: "10"
      budgets:
        description: The counts of the evaluations, with commas
        required: true
        default: "200,400"

permissions:
  contents: read

# Two runs on one commit wait for each other, so each run has the whole runner.
concurrency:
  group: study-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The study
        env:
          SEEDS: ${{ inputs.seeds }}
          BUDGETS: ${{ inputs.budgets }}
        run: node scripts/study-evolve.ts --seeds "$SEEDS" --budgets "$BUDGETS" --out study-evolve.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: study-evolve
          path: study-evolve.json
          if-no-files-found: error
